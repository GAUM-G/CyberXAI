<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard account{% endblock %} | Honeypot Security Framework</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:#05080f;color:#c9d6e3}
    main{width:min(440px,calc(100% - 32px));padding:32px;border:1px solid #263442;border-radius:10px;background:#0d1117;box-shadow:0 20px 60px #0008}
    h1{margin:0 0 8px;color:#00d4ff;font-size:1.45rem;letter-spacing:.04em}
    p{margin:0 0 24px;color:#9aafc2;line-height:1.4}
    label{display:block;margin:16px 0 7px;font-weight:600}
    input{width:100%;padding:12px;border:1px solid #405164;border-radius:6px;background:#131a24;color:#fff;font:inherit}
    input:focus{outline:2px solid #00d4ff;outline-offset:2px}
    button{width:100%;margin-top:24px;padding:12px;border:0;border-radius:6px;background:#00b8dc;color:#06111a;font:inherit;font-weight:700;cursor:pointer}
    button:hover{background:#00d4ff}
    .error{padding:11px;border:1px solid #a6384d;border-radius:6px;background:#34151d;color:#ffd9df}
    .success{padding:11px;border:1px solid #188a63;border-radius:6px;background:#0d3329;color:#b9ffe8}
    .links{margin:20px 0 0;text-align:center}
    a{color:#62dcfa}
    .hint{margin:12px 0 0;font-size:.88rem}
    main.wide{width:min(900px,calc(100% - 32px))}
    .password-field{position:relative}
    .password-field input{padding-right:54px}
    .password-field .toggle-password{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;margin:0;padding:0;border:0;background:transparent;color:#9aafc2;font-size:1.1rem}
    .notice-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#000a;z-index:20}
    .notice-box{width:min(420px,100%);padding:24px;border:1px solid #405164;border-radius:10px;background:#151e2a;box-shadow:0 20px 60px #000b}
    .notice-box h2{margin:0 0 12px;color:#00d4ff}
    .notice-box p{margin:0}
  </style>
</head>
<body>
  <main class="{% block main_class %}{% endblock %}">
    <h1>HONEYPOT.SYS</h1>
    <p>Defender dashboard · Analyst access</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    document.querySelectorAll('[data-toggle-password]').forEach(button => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.togglePassword);
        const visible = input.type === 'password';
        input.type = visible ? 'text' : 'password';
        button.textContent = visible ? '🙈' : '👁';
        button.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
        button.setAttribute('aria-pressed', String(visible));
      });
    });
  </script>
</body>
</html>
